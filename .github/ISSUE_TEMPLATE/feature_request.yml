name: Feature request
description: Suggest an improvement to zEssentials
labels: enhancement
assignees: Maxlego08
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to zEssentials. Describe the use case and how the feature would fit the plugin.
        zEssentials targets Paper and compatible forks, starting at Minecraft 1.21.4. Mention any version-specific requirements.
        For configuration help, use [Discord](https://discord.groupez.dev/).
  - type: checkboxes
    id: searched
    attributes:
      label: Before suggesting
      options:
        - label: "I have searched the [existing issues](https://github.com/Maxlego08/zEssentials/issues?q=is%3Aissue) and found no matching suggestion."
          required: true
        - label: "I have checked the [documentation](https://zessentials.groupez.dev/) and this feature is not already available."
          required: true
  - type: input
    id: discord_tag
    attributes:
      label: Discord username (optional)
      description: Your username if you would like us to contact you on Discord.
  - type: textarea
    id: use_case
    attributes:
      label: What problem would this solve?
      description: Describe a concrete use case and who would benefit from the feature.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe your suggestion
      description: Explain the expected behavior, affected module or commands, and any relevant permissions or configuration. Include an example of how it would be used.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: Describe any existing settings, workarounds or other plugins you have considered, and why they do not cover the use case.
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context (optional)
      description: Add screenshots, examples or links that help explain the suggestion. Include Minecraft versions or third-party plugin details if the feature depends on them.
  - type: markdown
    attributes:
      value: Thanks for taking the time to describe your suggestion!
