name: Bug report
description: Report a reproducible problem with zEssentials
labels: bug
assignees: Maxlego08
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with zEssentials. Please fill out the fields below so we can reproduce it.
        zEssentials requires Paper or a compatible fork on Minecraft 1.21.4 or newer, with a supported NMS module.
        For setup help, use [Discord](https://discord.groupez.dev/). Report duplication bugs and exploits privately there, not in a public issue.
  - type: checkboxes
    id: searched
    attributes:
      label: Before reporting
      options:
        - label: "I am using the latest zEssentials release and compatible versions of zMenu and PlaceholderAPI."
          required: true
        - label: "I have searched the [existing issues](https://github.com/Maxlego08/zEssentials/issues?q=is%3Aissue) and found no report of this problem."
          required: true
        - label: "I have checked the [documentation](https://zessentials.groupez.dev/) for the affected feature."
          required: true
  - type: input
    id: discord_tag
    attributes:
      label: Discord username (optional)
      description: Your username if you would like us to contact you on Discord.
  - type: dropdown
    id: server_version
    attributes:
      label: Minecraft version
      description: Select the server version, not the client version. Only versions with an NMS module are listed.
      options:
        - "26.3"
        - "26.2"
        - "1.21.11"
        - "1.21.10"
        - "1.21.9"
        - "1.21.8"
        - "1.21.7"
        - "1.21.6"
        - "1.21.5"
        - "1.21.4"
    validations:
      required: true
  - type: textarea
    id: server_software
    attributes:
      label: Server software and build
      description: "Paste the full output of `/version`, including the server software and build number."
      placeholder: "Full /version output"
    validations:
      required: true
  - type: input
    id: java_version
    attributes:
      label: Server Java version
      description: "Use the version shown in the server startup log or hosting panel. Minecraft 26.x requires Java 25."
      placeholder: "Java version used to run the server"
    validations:
      required: true
  - type: textarea
    id: plugin_version
    attributes:
      label: zEssentials version
      description: "Paste the full output of `/version zEssentials`. For a custom build, include the branch and commit. Do not write 'latest'."
      placeholder: "Full /version zEssentials output"
    validations:
      required: true
  - type: textarea
    id: zmenu_version
    attributes:
      label: zMenu version
      description: "Paste the full output of `/version zMenu`. Do not write 'latest'."
      placeholder: "Full /version zMenu output"
    validations:
      required: true
  - type: textarea
    id: placeholderapi_version
    attributes:
      label: PlaceholderAPI version
      description: "Paste the full output of `/version PlaceholderAPI`. Do not write 'latest'."
      placeholder: "Full /version PlaceholderAPI output"
    validations:
      required: true
  - type: dropdown
    id: storage_type
    attributes:
      label: Storage type
      description: "Select the `storage-type` configured in zEssentials/config.yml."
      options:
        - "SQLITE"
        - "MYSQL"
        - "MARIADB"
        - "HIKARICP"
        - "JSON"
    validations:
      required: true
  - type: dropdown
    id: reproduction_environment
    attributes:
      label: Reproduction environment
      description: If possible, try with only zEssentials, zMenu and PlaceholderAPI on Paper, using a vanilla client matching the server version.
      options:
        - "Reproduces with only zEssentials and its required dependencies"
        - "Only reproduces with additional plugins, datapacks or client modifications"
        - "Not tested with only the required dependencies"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behavior and the affected command or module.
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: What did you expect to happen?
      description: Describe the expected result.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include exact commands, relevant settings and item or enchantment identifiers. Mention whether the target player is online and whether the problem follows a reload or restart.
      placeholder: |
        1. Configure...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: input
    id: full_server_log
    attributes:
      label: latest.log (mclo.gs link)
      description: |
        Enable `enable-debug: true` in zEssentials/config.yml before reproducing; for database problems, also enable `database-configuration.debug`.
        1. Open [mclo.gs](https://mclo.gs/).
        2. Upload your server's `logs/latest.log` file, including startup and reproduction of the problem.
        3. Save the log on mclo.gs and paste the generated link in the field below.
        Review the log for sensitive information before sharing it and disable debug logging afterwards.
      placeholder: "https://mclo.gs/..."
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Relevant errors (optional)
      description: Paste the complete error and stack trace, if any. This does not replace the full server log.
      render: text
  - type: textarea
    id: configuration_files
    attributes:
      label: Relevant configuration and integrations (optional)
      description: |
        Paste the relevant configuration or attach the affected files. Include related plugins, datapacks and client modifications with their versions.
        For custom items or enchantments, include their identifiers and the plugin or datapack providing them. Mention REDIS or proxy setups when relevant.
        Remove database credentials, tokens, webhook URLs and other secrets before sharing files.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or videos (optional)
      description: Attach images or a video if they help show the problem.
  - type: markdown
    attributes:
      value: Thanks for taking the time to provide a complete bug report!
