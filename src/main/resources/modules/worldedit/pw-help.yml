name: "<c:#555555>Help Player Warp"
size: 54
items:
  pw-set:
    slot: 11
    item:
      material: PAPER
      name: "<c:#8CC0CC>Command"
      lore:
        - "<c:#AAAAAA>● <c:#FFFFFF>/pw set <material>"
        - ""
        - "<c:#8CC0CC>Description"
        - "<c:#AAAAAA>● <c:#FFFFFF>Allows you to place blocks in your selection"
        - ""
        - "<c:#EDACFE>xample"
        - "<c:#AAAAAA>● <c:#FFFFFF>/pw set stone"
  pw-fill:
    slot: 12
    item:
      material: PAPER
      name: "<c:#8CC0CC>Command"
      lore:
        - "<c:#AAAAAA>● <c:#FFFFFF>/pw fill <material>"
        - ""
        - "<c:#8CC0CC>Description"
        - "<c:#AAAAAA>● <c:#FFFFFF>Allows you to fill your selection with blocks"
        - "<c:#AAAAAA>● <c:#AAAAAA>This command will only take into account"
        - "<c:#AAAAAA>● <c:#AAAAAA>the air blocks"
        - ""
        - "<c:#EDACFE>xample"
        - "<c:#AAAAAA>● <c:#FFFFFF>/pw fill stone"
  pw-walls:
    slot: 13
    item:
      material: PAPER
      name: "<c:#8CC0CC>Command"
      lore:
        - "<c:#AAAAAA>● <c:#FFFFFF>/pw walls <material>"
        - ""
        - "<c:#8CC0CC>Description"
        - "<c:#AAAAAA>● <c:#FFFFFF>Allows you to create walls around your selection"
        - ""
        - "<c:#EDACFE>xample"
        - "<c:#AAAAAA>● <c:#FFFFFF>/pw walls stone"
  pw-cyl:
    slot: 14
    item:
      material: PAPER
      name: "<c:#8CC0CC>Command"
      lore:
        - "<c:#AAAAAA>● <c:#FFFFFF>/pw cyl <material> <radius> <height> [<filled or not>]"
        - ""
        - "<c:#8CC0CC>Description"
        - "<c:#AAAAAA>● <c:#FFFFFF>Allows you to create a cylinder from the first position"
        - "<c:#AAAAAA>● <c:#FFFFFF>selected (pos1 or left click)"
        - "<c:#AAAAAA>● <c:#AAAAAA>To define if the cylinder is filled or not,"
        - "<c:#AAAAAA>● <c:#AAAAAA>you must enter true or false"
        - ""
        - "<c:#EDACFE>xample"
        - "<c:#AAAAAA>● <c:#FFFFFF>/pw cyl stone 5 5 true"
  pw-cut:
    slot: 15
    item:
      material: PAPER
      name: "<c:#8CC0CC>Command"
      lore:
        - "<c:#AAAAAA>● <c:#FFFFFF>/pw cut"
        - ""
        - "<c:#8CC0CC>Description"
        - "<c:#AAAAAA>● <c:#FFFFFF>Allows you to remove the blocks in your selection"
        - ""
        - "<c:#EDACFE>xample"
        - "<c:#AAAAAA>● <c:#FFFFFF>/pw cut"
  pw-confirm:
    slot: 20
    item:
      material: PAPER
      name: "<c:#8CC0CC>Command"
      lore:
        - "<c:#AAAAAA>● <c:#FFFFFF>/pw confirm"
        - ""
        - "<c:#8CC0CC>Description"
        - "<c:#AAAAAA>● <c:#FFFFFF>Allows you to confirm the action"
        - "<c:#AAAAAA>● <c:#AAAAAA>You must execute this command"
        - "<c:#AAAAAA>● <c:#AAAAAA>after defining your action <c:#555555>(/pw set, /pw fill etc)"
        - ""
        - "<c:#EDACFE>xample"
        - "<c:#AAAAAA>● <c:#FFFFFF>/pw confirm"
  pw-pos1:
    slot: 21
    item:
      material: PAPER
      name: "<c:#8CC0CC>Command"
      lore:
        - "<c:#AAAAAA>● <c:#FFFFFF>/pw pos1"
        - ""
        - "<c:#8CC0CC>Description"
        - "<c:#AAAAAA>● <c:#FFFFFF>Allows you to define the first position"
        - "<c:#AAAAAA>● <c:#FFFFFF> of your selection"
        - ""
        - "<c:#EDACFE>xample"
        - "<c:#AAAAAA>● <c:#FFFFFF>/pw pos1"
  pw-pos2:
    slot: 22
    item:
      material: PAPER
      name: "<c:#8CC0CC>Command"
      lore:
        - "<c:#AAAAAA>● <c:#FFFFFF>/pw pos2"
        - ""
        - "<c:#8CC0CC>Description"
        - "<c:#AAAAAA>● <c:#FFFFFF>Allows you to define the second position"
        - "<c:#AAAAAA>● <c:#FFFFFF> of your selection"
        - ""
        - "<c:#EDACFE>xample"
        - "<c:#AAAAAA>● <c:#FFFFFF>/pw pos2"
  pw-cancel:
    slot: 23
    item:
      material: PAPER
      name: "<c:#8CC0CC>Command"
      lore:
        - "<c:#AAAAAA>● <c:#FFFFFF>/pw cancel"
        - ""
        - "<c:#8CC0CC>Description"
        - "<c:#AAAAAA>● <c:#FFFFFF>Allows you to cancel the current selection"
        - ""
        - "<c:#EDACFE>xample"
        - "<c:#AAAAAA>● <c:#FFFFFF>/pw cancel"
  pw-stop:
    slot: 24
    item:
      material: PAPER
      name: "<c:#8CC0CC>Command"
      lore:
        - "<c:#AAAAAA>● <c:#FFFFFF>/pw stop"
        - ""
        - "<c:#8CC0CC>Description"
        - "<c:#AAAAAA>● <c:#FFFFFF>Allows you to stop the current editing"
        - "<c:#AAAAAA>● <c:#AAAAAA>Only the blocks not placed will be refunded"
        - ""
        - "<c:#EDACFE>xample"
        - "<c:#AAAAAA>● <c:#FFFFFF>/pw stop"

  info1:
    slot: 42
    item:
      material: PAPER
      name: "<c:#8CC0CC>Add multiple materials"
      lore:
        - "<c:#AAAAAA>● <c:#FFFFFF>You can define multiple materials"
        - "<c:#AAAAAA>● <c:#FFFFFF>In the same command, you must add a <u>comma</u>"
        - "<c:#AAAAAA>● <c:#FFFFFF>between each material"
        - ""
        - "<c:#EDACFE>xample"
        - "<c:#AAAAAA>● <c:#FFFFFF>/pw set <c:#FF94D7>stone<c:#77FF77>,<c:#FF94D7>dirt<c:#77FF77>,<c:#FF94D7>grass_block"
  info2:
    slot: 43
    item:
      material: PAPER
      name: "<c:#8CC0CC>Modify the percentage"
      lore:
        - "<c:#AAAAAA>● <c:#FFFFFF>You can define the percentage to apply"
        - "<c:#AAAAAA>● <c:#FFFFFF>To a material, you must add a <u>:</u> and the <u>number</u>"
        - "<c:#AAAAAA>● <c:#FFFFFF>between 1 and 100"
        - ""
        - "<c:#EDACFE>xample"
        - "<c:#AAAAAA>● <c:#FFFFFF>/pw set <c:#FF94D7>stone,dirt<c:#77FF77>:5<c:#FF94D7>,grass_block<c:#77FF77>:10"
  info3:
    slot: 40
    item:
      material: PAPER
      name: "<c:#8CC0CC>Get a baguette"
      lore:
        - ""
        - "<c:#AAAAAA>● <c:#FFFFFF>You can get a <c:#FF94D7>baguette"
        - "<c:#AAAAAA>● <c:#FFFFFF>In voting <c:#555555>(/vote)<c:#FFFFFF>, in the store <c:#555555>(/store<c:#555555>)"
        - "<c:#AAAAAA>● <c:#FFFFFF>Or in the island store <c:#555555>(/isq<c:#555555>)"
        - ""

  option-inventory:
    slot: 37
    placeholder: '%zessentials_user_worldedit_option_inventory%'
    value: true
    action: BOOLEAN
    actions:
      - type: player_command
        commands:
          - "pw option inventory"
      - type: refresh
        delay: 2
    item:
      material: PAPER
      name: "<c:#8CC0CC>Option<c:#555555>: <c:#FF94D7>Inventory"
      lore:
        - ""
        - "<c:#AAAAAA>● <c:#8CC0CC>State<c:#555555>: <c:#77FF77>Active"
        - ""
        - "<c:#8CC0CC>Description"
        - "<c:#AAAAAA>● <c:#FFFFFF>Uses the blocks in your inventory"
        - "<c:#AAAAAA>● <c:#FFFFFF>in addition to those in your /sac"
    else:
      actions:
        - type: player_command
          commands:
            - "pw option inventory"
        - type: refresh
          delay: 2
      item:
        material: PAPER
        name: "<c:#8CC0CC>Option<c:#555555>: <c:#FF94D7>Inventory"
        lore:
          - ""
          - "<c:#AAAAAA>● <c:#8CC0CC>State<c:#555555>: <c:#FF3535>Inactive"
          - ""
          - "<c:#8CC0CC>Description"
          - "<c:#AAAAAA>● <c:#FFFFFF>Uses the blocks in your inventory"
          - "<c:#AAAAAA>● <c:#FFFFFF>in addition to those in your /sac"

  option-bossbar:
    slot: 38
    placeholder: '%zessentials_user_worldedit_option_bossbar%'
    value: false
    action: BOOLEAN
    actions:
      - type: player_command
        commands:
          - "pw option bossbar"
      - type: refresh
        delay: 2
    item:
      material: PAPER
      name: "<c:#8CC0CC>Option<c:#555555>: <c:#FF94D7>Progress bar"
      lore:
        - ""
        - "<c:#AAAAAA>● <c:#8CC0CC>State<c:#555555>: <c:#77FF77>Active"
        - ""
        - "<c:#8CC0CC>Description"
        - "<c:#AAAAAA>● <c:#FFFFFF>Allows you to display a progress bar"
        - "<c:#AAAAAA>● <c:#FFFFFF>at the top of your screen"
    else:
      actions:
        - type: player_command
          commands:
            - "pw option bossbar"
        - type: refresh
          delay: 2
      item:
        material: PAPER
        name: "<c:#8CC0CC>Option<c:#555555>: <c:#FF94D7>Progress bar"
        lore:
          - ""
          - "<c:#AAAAAA>● <c:#8CC0CC>State<c:#555555>: <c:#FF3535>Inactive"
          - ""
          - "<c:#8CC0CC>Description"
          - "<c:#AAAAAA>● <c:#FFFFFF>Allows you to display a progress bar"
          - "<c:#AAAAAA>● <c:#FFFFFF>at the top of your screen"