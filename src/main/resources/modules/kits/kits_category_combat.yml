# zEssentials - Combat Category Menu
# This menu displays combat kits directly (no subcategories)

name: kits_category_combat # Menu name
type: CHEST # Menu inventory type
size: 54 # Inventory size
# Min permission to open this menu
open-permission: null

# Menu title with professional styling
title: "<c:#AA0000><bold>⚔ <c:#FF5555><bold>COMBAT KITS <c:#AA0000><bold>⚔"

# Fill empty slots
fillItem:
  material: BLACK_STAINED_GLASS_PANE
  name: " "

items:
  # Top decoration
  top-border-1:
    slot: 0
    material: RED_STAINED_GLASS_PANE
    name: " "
  top-border-2:
    slot: 1
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  top-border-3:
    slot: 2
    material: RED_STAINED_GLASS_PANE
    name: " "
  top-border-4:
    slot: 3
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  
  # Title
  title-sword:
    slot: 4
    material: DIAMOND_SWORD
    name: "<c:#FF5555><bold>⚔ COMBAT KITS ⚔"
    lore:
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
      - "<c:#AAAAAA>Browse all combat kits"
      - "<c:#AAAAAA>Total kits: <c:#FFFFFF>%kit_count%"
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
  
  top-border-5:
    slot: 5
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  top-border-6:
    slot: 6
    material: RED_STAINED_GLASS_PANE
    name: " "
  top-border-7:
    slot: 7
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  top-border-8:
    slot: 8
    material: RED_STAINED_GLASS_PANE
    name: " "
  
  # Side borders
  left-border:
    slots: [9, 18, 27, 36]
    material: RED_STAINED_GLASS_PANE
    name: " "
  
  right-border:
    slots: [17, 26, 35, 44]
    material: RED_STAINED_GLASS_PANE
    name: " "
  
  # Kit display area (3x7 grid for kits)
  # Slots 10-16, 19-25, 28-34, 37-43 are for kits
  combat-kits:
    slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]
    type: zessentials_kit_category
    category: "Combat"
    material: DIAMOND_SWORD
    name: "<c:#FF5555><bold>⚔ %kit_display_name%"
    lore:
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
      - " "
      - "  <c:#AAAAAA>Kit Name: <c:#FFFFFF>%kit_name%"
      - "  <c:#AAAAAA>Cooldown: <c:#55FFFF>%cooldown%"
      - " "
      - "  <c:#FF5555>⚔ <c:#AAAAAA>Combat equipment kit"
      - " "
      - "  <c:#AAAAAA>Status: %available|<c:#55FF55>✔ Available|<c:#FF5555>✖ On cooldown%"
      - "  <c:#AAAAAA>Time left: <c:#FFFF55>%time_remaining%"
      - " "
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
      - "<c:#55FF55>▶ <c:#AAAAAA>Left-click to <c:#FFFFFF>get kit"
      - "<c:#FFFF55>▶ <c:#AAAAAA>Right-click to <c:#FFFFFF>preview"
  
  # Bottom navigation
  previous-page:
    slot: 45
    material: SPECTRAL_ARROW
    name: "<c:#FFFF55><bold>« PREVIOUS PAGE"
    lore:
      - "<c:#AAAAAA>Go to previous page"
    actions:
      - type: previous page
  
  back-button:
    slots: [46, 47, 48]
    material: DARK_OAK_DOOR
    name: "<c:#FF5555><bold>⬅ BACK"
    lore:
      - "<c:#AAAAAA>Return to categories"
    actions:
      - type: open inventory
        inventory: 'kits_categories'
  
  refresh-button:
    slots: [49, 50, 51]
    material: EMERALD
    name: "<c:#55FF55><bold>↻ REFRESH"
    lore:
      - "<c:#AAAAAA>Refresh available kits"
    refreshOnClick: true
  
  next-page:
    slot: 53
    material: SPECTRAL_ARROW
    name: "<c:#FFFF55><bold>NEXT PAGE »"
    lore:
      - "<c:#AAAAAA>Go to next page"
    actions:
      - type: next page
  
  page-info:
    slot: 52
    material: PAPER
    name: "<c:#AAAAAA>Page <c:#FFFF55>%page% <c:#AAAAAA>of <c:#FFFF55>%maxPage%"