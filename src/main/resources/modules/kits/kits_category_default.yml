# zEssentials - Tools Category Menu
# This menu displays tools category with subcategories

name: kits_category_default # Menu name
type: CHEST # Menu inventory type
size: 54 # Inventory size
# Min permission to open this menu
open-permission: null

# Menu title with professional styling
title: "<c:#FFAA00><bold>⛏ <c:#FFFF55><bold>TOOLS CATEGORY <c:#FFAA00><bold>⛏"

# Fill empty slots
fillItem:
  material: BLACK_STAINED_GLASS_PANE
  name: " "

items:
  # Top decoration
  top-deco:
    slots: [0, 2, 4, 6, 8]
    material: YELLOW_STAINED_GLASS_PANE
    name: " "
  
  top-deco-alt:
    slots: [1, 3, 5, 7]
    material: ORANGE_STAINED_GLASS_PANE
    name: " "
  
  # Information panels
  tools-overview:
    slot: 10
    material: CRAFTING_TABLE
    name: "<c:#FFFF55><bold>⚒ TOOLS OVERVIEW"
    lore:
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
      - "<c:#AAAAAA>Select a subcategory below"
      - "<c:#AAAAAA>to browse specific tool kits"
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
  
  info-panel:
    slot: 13
    material: COMPASS
    name: "<c:#55FFFF><bold>ℹ INFORMATION"
    lore:
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
      - "<c:#AAAAAA>Total Categories: <c:#FFFFFF>2"
      - "<c:#AAAAAA>Total Tool Kits: <c:#FFFFFF>%kit_count%"
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
  
  categories-list:
    slot: 16
    material: ANVIL
    name: "<c:#FF55FF><bold>⚙ CATEGORIES"
    lore:
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
      - "<c:#55FF55>▪ <c:#AAAAAA>Beginner Tools"
      - "<c:#55FFFF>▪ <c:#AAAAAA>Advanced Tools"
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
  
  # Subcategory: Beginner
  beginner-tools:
    slot: 29
    type: zessentials_kit_subcategory_selector
    category: "Tools"
    subcategory: "Beginner"
    material: WOODEN_PICKAXE
    name: "<c:#55FF55><bold>☘ BEGINNER TOOLS"
    lore:
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
      - " "
      - "  <c:#555555>▶ <c:#AAAAAA>Level: <c:#55FF55><bold>Beginner"
      - "  <c:#555555>▶ <c:#AAAAAA>Kits Available: <c:#FFFFFF>%kit_count%"
      - " "
      - "  <c:#AAAAAA>Perfect for new players!"
      - "  <c:#AAAAAA>Includes basic tools and"
      - "  <c:#AAAAAA>materials to get started."
      - " "
      - "  <c:#555555>• <c:#AAAAAA>Wooden tools"
      - "  <c:#555555>• <c:#AAAAAA>Stone tools"
      - "  <c:#555555>• <c:#AAAAAA>Basic materials"
      - " "
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
      - "<c:#55FF55><bold>➤ CLICK TO BROWSE"
    actions:
      - type: open inventory
        inventory: 'kits_subcategory_default_beginner'
    enchants:
      - efficiency,1
    flags:
      - HIDE_ENCHANTS
  
  # Subcategory: Advanced
  advanced-tools:
    slot: 33
    type: zessentials_kit_subcategory_selector
    category: "Tools"
    subcategory: "Advanced"
    material: NETHERITE_PICKAXE
    name: "<c:#55FFFF><bold>⚡ ADVANCED TOOLS"
    lore:
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
      - " "
      - "  <c:#555555>▶ <c:#AAAAAA>Level: <c:#55FFFF><bold>Advanced"
      - "  <c:#555555>▶ <c:#AAAAAA>Kits Available: <c:#FFFFFF>%kit_count%"
      - " "
      - "  <c:#AAAAAA>For experienced players!"
      - "  <c:#AAAAAA>High-tier tools with"
      - "  <c:#AAAAAA>powerful enchantments."
      - " "
      - "  <c:#555555>• <c:#AAAAAA>Diamond tools"
      - "  <c:#555555>• <c:#AAAAAA>Netherite tools"
      - "  <c:#555555>• <c:#AAAAAA>Enchanted gear"
      - " "
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
      - "<c:#55FFFF><bold>➤ CLICK TO BROWSE"
    actions:
      - type: open inventory
        inventory: 'kits_subcategory_default_advanced'
    enchants:
      - efficiency,3
      - unbreaking,2
    flags:
      - HIDE_ENCHANTS
  
  # Decorative elements
  deco-glass-1:
    slots: [20, 21, 22, 23, 24]
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  
  quick-tip:
    slot: 31
    material: EXPERIENCE_BOTTLE
    name: "<c:#55FF55><bold>✨ QUICK TIP"
    lore:
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
      - "<c:#AAAAAA>Choose the category that"
      - "<c:#AAAAAA>matches your experience level!"
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
  
  # Bottom navigation
  back-button:
    slots: [46, 47, 48]
    material: DARK_OAK_DOOR
    name: "<c:#FF5555><bold>⬅ BACK"
    lore:
      - "<c:#AAAAAA>Return to categories"
    actions:
      - type: open inventory
        inventory: 'kits_categories'
  
  all-tools:
    slots: [49, 50, 51]
    material: CHEST
    name: "<c:#FFAA00><bold>📦 ALL TOOLS"
    lore:
      - "<c:#AAAAAA>View all tool kits"
      - "<c:#AAAAAA>without category filter"
    type: zessentials_kit_category
    category: "Tools"
  
  # Bottom decoration
  bottom-deco:
    slots: [45, 52, 53]
    material: IRON_BLOCK
    name: "<c:#AAAAAA><bold>✦"