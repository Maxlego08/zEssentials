# zEssentials - Kit Categories Menu
# This menu displays available kit categories

name: kits_categories # Menu name
type: CHEST # Menu inventory type
size: 54 # Inventory size
# Min permission to open this menu
open-permission: null

# Menu title with gradient effect
title: "<c:#555555><bold>« <c:#FFFF55><bold>Kit Categories <c:#555555><bold>»"

# Fill all empty slots with black glass
fillItem:
  material: BLACK_STAINED_GLASS_PANE
  name: " "

items:
  # Top decoration line
  top-deco-1:
    slot: 0
    material: YELLOW_STAINED_GLASS_PANE
    name: " "
  top-deco-2:
    slot: 1
    material: ORANGE_STAINED_GLASS_PANE
    name: " "
  top-deco-3:
    slot: 2
    material: YELLOW_STAINED_GLASS_PANE
    name: " "
  top-deco-4:
    slot: 3
    material: ORANGE_STAINED_GLASS_PANE
    name: " "
  
  # Title/Info
  title-star:
    slot: 4
    material: NETHER_STAR
    name: "<c:#FFFF55><bold>✦ <c:#FFAA00><bold>KIT SYSTEM <c:#FFFF55><bold>✦"
    lore:
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
      - "<c:#AAAAAA>Welcome to the kit selection menu!"
      - "<c:#AAAAAA>Choose a category to browse available kits."
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
  
  top-deco-5:
    slot: 5
    material: ORANGE_STAINED_GLASS_PANE
    name: " "
  top-deco-6:
    slot: 6
    material: YELLOW_STAINED_GLASS_PANE
    name: " "
  top-deco-7:
    slot: 7
    material: ORANGE_STAINED_GLASS_PANE
    name: " "
  top-deco-8:
    slot: 8
    material: YELLOW_STAINED_GLASS_PANE
    name: " "
  
  # Side decorations
  left-deco-1:
    slot: 9
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  right-deco-1:
    slot: 17
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  left-deco-2:
    slot: 18
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  right-deco-2:
    slot: 26
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  left-deco-3:
    slot: 27
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  right-deco-3:
    slot: 35
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  left-deco-4:
    slot: 36
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  right-deco-4:
    slot: 44
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  
  # Category: Tools
  tools-category:
    slot: 20
    type: zessentials_kit_category_selector
    category: "Tools"
    material: IRON_PICKAXE
    name: "<c:#FFFF55><bold>⛏ TOOLS"
    lore:
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
      - " "
      - "  <c:#AAAAAA>Category: <c:#FFFF55><bold>Tools"
      - "  <c:#AAAAAA>Available Kits: <c:#FFFFFF>%kit_count%"
      - " "
      - "  <c:#555555>▪ <c:#AAAAAA>Basic mining tools"
      - "  <c:#555555>▪ <c:#AAAAAA>Advanced equipment"
      - "  <c:#555555>▪ <c:#AAAAAA>Building materials"
      - " "
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
      - "<c:#55FF55>▶ <c:#AAAAAA>Click to browse tools"
    actions:
      - type: open inventory
        inventory: 'kits_category_default'
    enchants:
      - efficiency,1
    flags:
      - HIDE_ENCHANTS
      - HIDE_ATTRIBUTES
  
  # Category: Combat
  combat-category:
    slot: 22
    type: zessentials_kit_category_selector
    category: "Combat"
    material: DIAMOND_SWORD
    name: "<c:#FF5555><bold>⚔ COMBAT"
    lore:
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
      - " "
      - "  <c:#AAAAAA>Category: <c:#FF5555><bold>Combat"
      - "  <c:#AAAAAA>Available Kits: <c:#FFFFFF>%kit_count%"
      - " "
      - "  <c:#555555>▪ <c:#AAAAAA>Weapons & armor"
      - "  <c:#555555>▪ <c:#AAAAAA>PvP equipment"
      - "  <c:#555555>▪ <c:#AAAAAA>Combat potions"
      - " "
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
      - "<c:#55FF55>▶ <c:#AAAAAA>Click to browse combat kits"
    actions:
      - type: open inventory
        inventory: 'kits_category_combat'
    enchants:
      - sharpness,1
    flags:
      - HIDE_ENCHANTS
      - HIDE_ATTRIBUTES
  
  # Category: Food
  food-category:
    slot: 24
    type: zessentials_kit_category_selector
    category: "Food"
    material: GOLDEN_APPLE
    name: "<c:#FFAA00><bold>🍖 FOOD"
    lore:
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
      - " "
      - "  <c:#AAAAAA>Category: <c:#FFAA00><bold>Food"
      - "  <c:#AAAAAA>Available Kits: <c:#FFFFFF>%kit_count%"
      - " "
      - "  <c:#555555>▪ <c:#AAAAAA>Food supplies"
      - "  <c:#555555>▪ <c:#AAAAAA>Golden foods"
      - "  <c:#555555>▪ <c:#AAAAAA>Consumables"
      - " "
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
      - "<c:#55FF55>▶ <c:#AAAAAA>Click to browse food kits"
    actions:
      - type: open inventory
        inventory: 'kits_category_food'
    enchants:
      - unbreaking,1
    flags:
      - HIDE_ENCHANTS
      - HIDE_ATTRIBUTES
  
  # Info panels
  info-book:
    slot: 11
    material: BOOK
    name: "<c:#FFFF55><bold>Information"
    lore:
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
      - "<c:#FFFF55><bold>► <c:#AAAAAA>Left Click: <c:#FFFFFF>Open category"
      - "<c:#FFFF55><bold>► <c:#AAAAAA>Categories: <c:#FFFFFF>3 available"
      - "<c:#FFFF55><bold>► <c:#AAAAAA>Permission: <c:#FFFFFF>Based on kit"
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
  
  cooldown-info:
    slot: 15
    material: CLOCK
    name: "<c:#55FFFF><bold>Kit Cooldowns"
    lore:
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
      - "<c:#AAAAAA>Each kit has its own cooldown"
      - "<c:#AAAAAA>Check kit info for details"
      - "<c:#555555>━━━━━━━━━━━━━━━━━━━"
  
  # Bottom navigation
  close-button:
    slot: 45
    material: BARRIER
    name: "<c:#FF5555><bold>✖ CLOSE"
    lore:
      - "<c:#AAAAAA>Close this menu"
    closeInventory: true
  
  back-button:
    slot: 46
    material: DARK_OAK_DOOR
    name: "<c:#FF5555><bold>← BACK"
    lore:
      - "<c:#AAAAAA>Return to kits menu"
    actions:
      - type: open inventory
        inventory: 'kits'
  
  bottom-deco-1:
    slot: 47
    material: RED_STAINED_GLASS_PANE
    name: " "
  bottom-deco-2:
    slot: 48
    material: RED_STAINED_GLASS_PANE
    name: " "
  
  refresh-button:
    slot: 49
    material: EMERALD
    name: "<c:#55FF55><bold>↻ REFRESH"
    lore:
      - "<c:#AAAAAA>Refresh kit categories"
    refreshOnClick: true
  
  bottom-deco-3:
    slot: 50
    material: RED_STAINED_GLASS_PANE
    name: " "
  bottom-deco-4:
    slot: 51
    material: RED_STAINED_GLASS_PANE
    name: " "
  bottom-deco-5:
    slot: 52
    material: RED_STAINED_GLASS_PANE
    name: " "
  
  all-kits-button:
    slot: 53
    material: CHEST
    name: "<c:#FFAA00><bold>📦 ALL KITS"
    lore:
      - "<c:#AAAAAA>View all kits without"
      - "<c:#AAAAAA>category filtering"
    actions:
      - type: open inventory
        inventory: 'kits'