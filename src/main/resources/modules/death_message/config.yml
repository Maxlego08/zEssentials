# Death Message Module Configuration
# This module allows you to customize death messages displayed in chat.

# Enable or disable this module
enable: true

# Allow players with essentials.silent.death permission to die without a death message
allow-silent-death: false

# Death message type:
# - DISABLE: No death messages will be shown
# - DEFAULT: Use vanilla Minecraft death messages
# - CUSTOM: Use custom death messages defined below
death-message-type: CUSTOM

# Custom death messages
# You can define multiple messages for each cause, one will be picked randomly
# Available placeholders:
# - %player% - The player who died
# - %displayName% - The display name of the player who died
# - %killer% - The player who killed (only for PLAYER cause)
# - %mob% - The mob that killed the player (only for MOB and MYTHIC_MOB causes)
# - %cause% - The cause of death (formatted)
#
# Supported causes:
# - GENERIC: Default death message when no specific cause matches
# - PLAYER: Death by another player
# - MOB: Death by vanilla mob
# - MYTHIC_MOB: Death by MythicMobs creature
# - And all vanilla damage causes: FALL, DROWNING, FIRE, LAVA, VOID, etc.
custom-messages:
  GENERIC:
    - "<c:#99E0FF>%player% <c:#AAAAAA>died."
  PLAYER:
    - "<c:#99E0FF>%player% <c:#AAAAAA>was slain by <c:#34CFE0>%killer%<c:#AAAAAA>."
    - "<c:#34CFE0>%killer% <c:#AAAAAA>killed <c:#99E0FF>%player%<c:#AAAAAA>."
  MOB:
    - "<c:#99E0FF>%player% <c:#AAAAAA>was killed by <c:#FF5555>%mob%<c:#AAAAAA>."
  MYTHIC_MOB:
    - "<c:#99E0FF>%player% <c:#AAAAAA>was slain by <gradient:#ff6600:#ff0000>%mob%</gradient><c:#AAAAAA>!"
  FALL:
    - "<c:#99E0FF>%player% <c:#AAAAAA>fell from a high place."
    - "<c:#99E0FF>%player% <c:#AAAAAA>hit the ground too hard."
  DROWNING:
    - "<c:#99E0FF>%player% <c:#AAAAAA>drowned."
  FIRE:
    - "<c:#99E0FF>%player% <c:#AAAAAA>burned to death."
  LAVA:
    - "<c:#99E0FF>%player% <c:#AAAAAA>tried to swim in lava."
  VOID:
    - "<c:#99E0FF>%player% <c:#AAAAAA>fell out of the world."
  LIGHTNING:
    - "<c:#99E0FF>%player% <c:#AAAAAA>was struck by lightning."
  STARVATION:
    - "<c:#99E0FF>%player% <c:#AAAAAA>starved to death."
  SUFFOCATION:
    - "<c:#99E0FF>%player% <c:#AAAAAA>suffocated in a wall."
  EXPLOSION:
    - "<c:#99E0FF>%player% <c:#AAAAAA>blew up."
  POISON:
    - "<c:#99E0FF>%player% <c:#AAAAAA>died of poisoning."
  WITHER:
    - "<c:#99E0FF>%player% <c:#AAAAAA>withered away."
  CRAMMING:
    - "<c:#99E0FF>%player% <c:#AAAAAA>was squished too much."
  FLY_INTO_WALL:
    - "<c:#99E0FF>%player% <c:#AAAAAA>experienced kinetic energy."
  FREEZE:
    - "<c:#99E0FF>%player% <c:#AAAAAA>froze to death."
