name: "ESSENTIALS_HOME_DOWN"
type: BUTTON
button:
  slot: '%slot%'
  view_requirement:
    requirements:
      - type: placeholder
        placeholder: "%zessentials_home_max%"
        value: '%home%'
        action: LOWER
  item:
    material: RED_DYE
    name: "<c:#FF0000>ɴᴏ ᴘᴇʀᴍɪssɪᴏɴ"
    lore:
      - "<c:#FCFCFC>You need a higher rank for this home"
  else:

    view_requirement:
      requirements:
        - type: placeholder
          placeholder: "%zessentials_home_exist_home_%remove_one_home%%"
          value: 'false'
          action: EQUALS_STRING

    commands:
      - 'sethome home_%zessentials_home_count%'
    closeInventory: true

    item:
      material: GRAY_DYE
      name: "<c:#CFCFCF>ɴᴏ ʜᴏᴍᴇ sᴇᴛ"
      lore:
        - '#fcfcfcClick to create a home'

    else:

      commands:
        - 'delhome home_%remove_one_home%'
      closeInventory: true

      item:
        material: BLUE_DYE
        name: "<c:#00A4FC>ʜᴏᴍᴇ %home%"
        lore:
          - '#fcfcfcClick to delete this home'