name: zEssentials
version: ${version}
main: fr.maxlego08.essentials.ZEssentialsPlugin
loader: fr.maxlego08.essentials.ZEssentialsPluginLoader
folia-supported: true
description: Provides an essential, core set of commands. Requires Paper.
website: https://groupez.dev/
authors: [ Maxlego08 ]
contributors: [ Louis_Dew, Traqueur, JavaToastDev, Melon-Oof, alwyn974, Mapacheee, NeiiZun, groundbreakingmc ]
api-version: '1.20'

dependencies:
