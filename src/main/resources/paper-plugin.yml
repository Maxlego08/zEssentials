    BlockTracker:
      load: BEFORE
      required: false
      join-classpath: true
    WorldGuard:
      load: BEFORE
      required: false
      join-classpath: true
    Votifier:
      load: BEFORE
      required: false
      join-classpath: true
    NChat:
      load: BEFORE
      required: false
      join-classpath: true
    MythicMobs:
      load: BEFORE
      required: false
      join-classpath: true
    AxVaults:
      load: BEFORE
